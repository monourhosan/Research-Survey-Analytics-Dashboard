<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Research Survey</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="public-page-body">
  <div class="survey-public-card" id="survey-card">
    <!-- Header -->
    <header class="survey-public-header">
      <div class="public-survey-brand" aria-label="Research Survey Analytics Dashboard">
        <span class="public-survey-brand-mark" aria-hidden="true">R</span>
        <span>Research Survey Analytics</span>
      </div>
      <div class="public-survey-header-meta">
        <span>Research questionnaire</span>
        <span aria-hidden="true">•</span>
        <span>Participant form</span>
      </div>
      <h1 id="survey-title">Loading survey...</h1>
      <p id="survey-desc"></p>
    </header>

    <!-- Body -->
    <div class="survey-public-body" id="survey-form-container">
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        <div class="empty-state-title">Loading questions...</div>
      </div>
    </div>
  </div>

  <p class="public-survey-footer">Your responses are used only for the research purpose described in this questionnaire.</p>

  <div id="toast-container"></div>
  <script src="js/common.js"></script>
  <script src="js/survey.js"></script>
</body>
</html>
