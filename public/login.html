<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Admin Login - Research Survey Analytics Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 20%, var(--palette-cream) 0%, #ded7c2 100%);
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 48px;
      height: 48px;
      background: var(--color-primary);
      color: var(--palette-cream);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      margin: 0 auto 16px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 13.5px;
      color: var(--color-text-muted);
    }

    .demo-credentials-box {
      margin-top: 24px;
      padding: 14px;
      background: var(--color-background);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      color: var(--color-text-muted);
    }

    .demo-credentials-box strong {
      color: var(--color-text);
    }

    .btn-fill-demo {
      display: inline-block;
      margin-top: 8px;
      color: var(--color-primary);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      border: none;
      background: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">R</div>
        <h1 class="login-title">Research Survey Analytics Dashboard</h1>
        <p class="login-subtitle">Sign in to access research survey analytics</p>
      </div>

      <form id="login-form" method="post" action="/api/auth/login">
        <div class="form-group">
          <label for="email" class="form-label">Admin Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="admin@research.local" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; padding: 11px;">
          Sign In
        </button>
      </form>

      <div class="demo-credentials-box">
        <div><strong>Demo Credentials (Local Defense Only):</strong></div>
        <div>Email: <code>admin@research.local</code></div>
        <div>Password: <code>Admin123!</code></div>
        <button type="button" id="btn-autofill" class="btn-fill-demo">Auto-fill Demo Credentials</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
